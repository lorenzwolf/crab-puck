; Upload/monitor ports are auto-detected; add `upload_port = COMx` if you
; have more than one serial device plugged in.
; Default 4 MB partition table so the same image runs on both the 4 MB and
; 16 MB T-Display variants.
[env:crabpuck]
platform = espressif32@6.6.0
board = lilygo-t-display
framework = arduino
monitor_speed = 115200

lib_deps = bodmer/TFT_eSPI@2.5.43

build_flags =
    -DUSER_SETUP_LOADED=1
    -DST7789_DRIVER=1
    -DTFT_WIDTH=135
    -DTFT_HEIGHT=240
    -DCGRAM_OFFSET=1
    -DTFT_MISO=-1
    -DTFT_MOSI=19
    -DTFT_SCLK=18
    -DTFT_CS=5
    -DTFT_DC=16
    -DTFT_RST=23
    -DTFT_BL=4
    -DTFT_BACKLIGHT_ON=HIGH
    -DLOAD_GLCD=1
    -DLOAD_FONT2=1
    -DLOAD_FONT4=1
    -DSMOOTH_FONT=1
    -DSPI_FREQUENCY=40000000
    -DSPI_READ_FREQUENCY=6000000

; Screenshot build: streams every frame over serial at 2 Mbaud for
; tools/capture.py. Not for everyday use - the hooks talk at 115200.
[env:capture]
extends = env:crabpuck
build_flags =
    ${env:crabpuck.build_flags}
    -DCRAB_CAPTURE=1
